<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- Encoding and Viewport -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" type="text/css" href="/loading-screen.css" />
  <link rel="stylesheet" type="text/css" href="/theme-fonts.css" media="print" onload="this.media='all'" />
  <!-- Default Page Title -->
  <title>见外工具集</title>
</head>

<body>
  <!-- built files will be auto injected -->
  <div id="app">
    <!-- Loading screen, will be replaced when app loaded -->
    <div class="loading-placeholder" id="loader">
      <img src="/seeway-mark.svg" alt="见外 SEEWAY" width="64" height="64">
      <h1>见外工具集</h1>
      <p class="loading" role="status">正在加载工具集…</p>
      <!-- Error message, only visible if app not mounted within 5 secs -->
      <div class="catastrophic-error" id="err-wrap" style="display:none;">
        <p class="err-l1">页面暂时无法加载</p>
        <p class="err-l2">请刷新重试；若仍无法打开，请联系工具维护同事。</p>
      </div>
    </div>
  </div>
  <!-- Devices without JS enabled -->
  <noscript>
    <strong>请启用 JavaScript 后使用见外工具集。</strong>
  </noscript>

  <!-- Show error message if app not mounted within reasonable time frame -->
  <script>
    setTimeout(() => {
      const loaderElem = document.getElementById('loader');
      if (loaderElem) loaderElem.classList.add('still-not-loaded');
    }, 7500);
  </script>

  <!-- Vite entry point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
